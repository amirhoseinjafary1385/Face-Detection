<!DOCTYPE html>
<html lang="en">
<head>

  <title>Login · FaceRec</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="brand">🧠 FaceRec</div>
  <div class="links">
    <a href="{{ url_for('index') }}">Home</a>
  </div>
</nav>

<main class="container narrow">
  <h1>Login</h1>

    {% if messages %}
      <div class="flashes">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
